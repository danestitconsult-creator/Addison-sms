/* ---------- restore room: import a backup file ---------- */
const BK_NAMES={config:'School settings',classes:'Classes',subjects:'Subjects',assignments:'Teacher assignments',timetable:'Timetable',students:'Students',attendance:'Attendance',scores:'Scores',cards:'Report cards',invoices:'Invoices',payments:'Fee payments',expenses:'Expenses',feeplans:'Fee plans',applications:'Applications',notices:'Notices',staffAttendance:'Staff attendance'},BK_BILL=['subUntil','plan','plans','payInfo'];
let bkData=null;
function bkRevive(v){if(Array.isArray(v))return v.map(bkRevive);if(v&&typeof v==='object'){const k=Object.keys(v);
 if(k.length&&k.every(x=>['seconds','nanoseconds','type'].includes(x))&&typeof v.seconds==='number'&&typeof v.nanoseconds==='number')return new firebase.firestore.Timestamp(v.seconds,v.nanoseconds);
 if(k.length===2&&typeof v._seconds==='number'&&typeof v._nanoseconds==='number')return new firebase.firestore.Timestamp(v._seconds,v._nanoseconds);
 const o={};k.forEach(x=>o[x]=bkRevive(v[x]));return o}return v}
async function bkread(){const f=$('bki').files[0];bkData=null;$('bkp').innerHTML='';say('bkm2','');if(!f)return;
 if(f.size>25e6)return say('bkm2','That file is too large to be a school backup.','bad');
 try{const o=JSON.parse(await f.text());if(!o||typeof o!=='object'||Array.isArray(o)||!o.at)throw 0;const cols={};
  Object.keys(BK_NAMES).forEach(c=>{if(Array.isArray(o[c])){const ok=o[c].filter(d=>d&&typeof d.id==='string'&&d.id&&d.id.indexOf('/')<0&&d.id!=='.'&&d.id!=='..');if(ok.length)cols[c]=ok}});
  if(!Object.keys(cols).length)throw 0;bkData={at:o.at,cols};
  const when=isNaN(new Date(o.at))?'':new Date(o.at).toLocaleString();
  $('bkp').innerHTML=`<div class="msg good">Backup file read. It was made on ${esc(when)}.</div><table style="margin-top:8px"><tr><th>Records in the file</th><th>Count</th></tr>${Object.keys(cols).map(c=>`<tr><td>${BK_NAMES[c]}</td><td>${cols[c].length}</td></tr>`).join('')}</table>
  <h3>How should it be restored?</h3>
  <label class="chk"><input type="radio" name="bkmode" value="add" checked><span><b>Add missing records only.</b> Safe: nothing already in the system is changed.</span></label>
  <label class="chk"><input type="radio" name="bkmode" value="over"><span><b>Replace matching records</b> with the backup version. Newer changes to those records are lost.</span></label>
  ${cols.config?'<label class="chk"><input type="checkbox" id="bkcfg"><span>Also restore school settings (scoring, periods, name). Subscription and payment settings are never changed.</span></label>':''}
  <label class="chk"><input type="checkbox" id="bkok"><span>I understand this changes the live school data.</span></label><button class="g" data-a="bkrun">Restore now</button>`}
 catch(e){say('bkm2','That is not a school backup file. Choose a file made with Download backup file.','bad')}}
async function bkrun(){if(!bkData)return;if(!navigator.onLine)return say('bkm2','Connect to the internet to restore.','bad');
 if(!$('bkok').checked)return say('bkm2','Tick the box to confirm.','bad');
 const mode=document.querySelector('input[name=bkmode]:checked').value,withCfg=!!($('bkcfg')&&$('bkcfg').checked);
 if(!confirm(mode==='over'?'Replace matching records with the backup version? This cannot be undone.':'Add the missing records from the backup?'))return;
 let total=0,done=0,skipped=0;Object.keys(bkData.cols).forEach(c=>{if(c!=='config'||withCfg)total+=bkData.cols[c].length});
 try{for(const c of Object.keys(bkData.cols)){let list=bkData.cols[c];if(c==='config'){if(!withCfg)continue;list=list.filter(d=>d.id==='main')}
   const have=new Set();if(mode==='add'&&c!=='config'){(await COL(c).get()).forEach(d=>have.add(d.id))}
   for(let i=0;i<list.length;i+=400){const b=db.batch();let n=0;
    list.slice(i,i+400).forEach(d=>{const {id,...data}=d;if(have.has(id)){skipped++;return}const x=bkRevive(data);if(c==='config')BK_BILL.forEach(k=>delete x[k]);b.set(COL(c).doc(id),x,c==='config'?{merge:true}:{});n++});
    if(n)await b.commit();done+=n;say('bkm2','Restoring… '+(done+skipped)+' of '+total)}}
  say('bkm2','Restore finished. '+done+' record'+(done===1?'':'s')+' restored'+(skipped?', '+skipped+' already there and left as they were':'')+'.','good');$('bkp').innerHTML='';$('bki').value='';bkData=null}
 catch(e){say('bkm2','Stopped after '+done+' records. '+why(e),'bad')}}

function compressImg(file,max){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const out=c.toDataURL('image/png');URL.revokeObjectURL(u);out.length<=400000?res(out):rej(new Error('That logo is too large even when shrunk. Try a smaller image.'))};im.onerror=()=>rej(new Error('That file is not an image.'));im.src=u})}

function vMe(){V(`${profileCardHtml()}<div class="card"><h2>Your role</h2><div>${esc(ROLES[U.role]||'')}</div><div class="mut" style="margin-top:6px">The head or administrator sets your role. Tell them if it is wrong.</div></div>`)}
async function myPhoto(){const f=$('ph1').files[0];if(!f)return;try{const d=await compressImg(f,220);await COL('users').doc(U.uid).update({photo:d});U.photo=d;go(tab,true);say('phm','Photo saved.','good')}catch(e){say('phm',e.message||why(e),'bad')}}
async function dashLogo(){const f=$('lg1').files[0];if(!f)return;try{const d=await compressImg(f,360);await COL('config').doc('main').set({logo:d},{merge:true});$('hlogo').src=d;say('lgm','Logo saved. It now shows in the header and on report cards.','good')}catch(e){say('lgm',e.message||why(e),'bad')}}
document.addEventListener('change',e=>{if(e.target.id==='bki')bkread();if(e.target.id==='ph1')myPhoto();if(e.target.id==='lg1')dashLogo()});


/* ---------- student photos and ID cards (printable) ---------- */
let stuPhoto=null;
const CARD_CSS='.idsheet{display:flex;flex-wrap:wrap;gap:4mm;padding:6mm}.idc{width:86mm;height:54mm;border:1px solid #333;border-radius:3mm;overflow:hidden;font:8.5pt/1.25 Arial,sans-serif;color:#000;display:flex;flex-direction:column;page-break-inside:avoid;background:#fff;box-sizing:border-box}.idh{background:#0b5e3a;color:#fff;padding:2mm 3mm;display:flex;align-items:center;gap:2mm}.idh img{height:9mm;width:9mm;object-fit:contain;background:#fff;border-radius:50%}.idh b{font-size:9pt}.idb{display:flex;gap:3mm;padding:2.5mm 3mm;flex:1}.idp{width:20mm;height:24mm;border:1px solid #999;object-fit:cover;background:#eee}.idt{flex:1;min-width:0}.idt .n{font-size:10pt;font-weight:bold}.idf{background:#f0f4f2;padding:1.5mm 3mm;font-size:7pt;display:flex;justify-content:space-between}';
const staffNo=p=>p.staffNo||('STF-'+String(p.id||p.uid||'').slice(0,6).toUpperCase());
function idCardHtml(p,kind){const logo=CFG.logo?'<img src="'+CFG.logo+'" alt="">':'';const photo=p.photo||'';
 const label=kind==='student'?'Student ID card':'Staff ID card';
 const line2=kind==='student'?'Class: '+esc(p.className||'-'):'Role: '+esc(ROLES[p.role]||'-');
 const num=kind==='student'?esc(p.no||''):esc(staffNo(p));
 return `<div class="idc"><div class="idh">${logo}<div><b>${esc(CFG.name)}</b><br><span style="font-size:7pt">${label}</span></div></div><div class="idb">${photo?'<img class="idp" src="'+photo+'" alt="">':'<div class="idp"></div>'}<div class="idt"><div class="n">${esc(p.name)}</div><div>${line2}</div><div>No: <b>${num}</b></div>${kind==='student'&&p.guardian?'<div>Guardian: '+esc(p.guardian)+'</div>':''}</div></div><div class="idf"><span>Valid ${esc(CFG.year||'')}</span><span>${esc(CFG.tel||'')}</span></div></div>`}
function idSheetPrint(items){printDoc('<style>'+CARD_CSS+'</style><div class="idsheet">'+items.map(x=>idCardHtml(x.p,x.k)).join('')+'</div>')}
function vIds(){V(`<div class="card"><h2>Student ID cards</h2><div class="row"><div><label>Class</label><select id="idc">${classOpts(st.idc||'')}</select></div><button class="g" data-a="idclass">Print ID cards for this class</button></div><p class="mut">Print at 100% scale on A4. Each card is 86 × 54 mm. Students need a photo first (set it at admission or on their record).</p></div>
 <div class="card"><h2>Staff ID cards</h2><p class="mut">Staff show their photo from My profile. Cards print for active administrators, teachers and accountants.</p><button class="g" data-a="idstaff">Print all staff ID cards</button></div>`);
 $('idc').onchange=()=>{st.idc=$('idc').value}}
async function idclass(){const cid=$('idc').value;if(!cid)return alert('Choose a class.');const S=rows(await COL('students').where('classId','==',cid).get()).filter(s=>s.status==='active').sort(byName);if(!S.length)return alert('No active students in this class.');idSheetPrint(S.map(s=>({k:'student',p:s})))}
async function idstaff(){const L=rows(await COL('users').get()).filter(u=>u.active!==false&&['admin','teacher','accountant'].includes(u.role)).sort(byName);if(!L.length)return alert('No staff to print.');idSheetPrint(L.map(u=>({k:'staff',p:u})))}
function stuPhotoOn(input){const f=input.files[0];if(!f)return;compressImg(f,240).then(d=>{stuPhoto=d;$('a11p').src=d;$('a11p').style.display=''}).catch(e=>alert(e.message||why(e)))}
async function stuPhotoSave(input){const f=input.files[0];if(!f||!st.cur)return;try{const d=await compressImg(f,240);await COL('students').doc(st.cur.id).update({photo:d});st.cur.photo=d;$('sphv').src=d;$('sphv').style.display='';alert('Photo saved.')}catch(e){alert(e.message||why(e))}}
document.addEventListener('change',e=>{if(e.target.id==='a11')stuPhotoOn(e.target);if(e.target.id==='sph1')stuPhotoSave(e.target)});
function idOne(){if(st.cur)idSheetPrint([{k:'student',p:st.cur}])}
function idMe(){idSheetPrint([{k:'staff',p:{...U,id:U.uid}}])}

document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t&&t.closest('nav'))return go(t.dataset.t);const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])return A[a.dataset.a](a.dataset,a)});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset||{};if(d.a2==='ttset')ttset(t);if(d.u&&d.f){COL('users').doc(d.u).update({[d.f]:t.type==='checkbox'?t.checked:t.value}).catch(x=>alert(why(x)))}if(t.dataset&&t.dataset.sc!==undefined)scCalc(t.dataset.sc)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.sc!==undefined)scCalc(t.dataset.sc)});
new MutationObserver(()=>document.querySelectorAll('input[type=number]:not([inputmode])').forEach(i=>i.setAttribute('inputmode','decimal'))).observe(document.body,{childList:true,subtree:true});
if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)busy('A new version is ready. Tap here to refresh.',()=>location.reload())});
 navigator.serviceWorker.register('sw.js').then(reg=>document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})})).catch(()=>{})}
</script></body></html>
